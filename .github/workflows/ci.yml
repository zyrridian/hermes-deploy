name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch repository
        run: |
          git init -q .
          git fetch --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt
      - run: shellcheck -x manage.sh test/roundtrip.sh
      - run: shfmt -d -i 2 -ci manage.sh test/roundtrip.sh
      - name: Compose file is valid
        run: |
          cp .env.example .env
          docker compose config -q

  roundtrip:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch repository
        run: |
          git init -q .
          git fetch --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ github.sha }}"
          git checkout -q FETCH_HEAD
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Backup / restore round trip
        run: test/roundtrip.sh
